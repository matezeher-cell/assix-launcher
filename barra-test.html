<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASSIX barra</title>
<link rel="apple-touch-icon" href="icono%20assix%20final.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASSIX barra">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000000; }
  /* con "black-translucent" la barra de estado es transparente y deja ver el fondo de esta pagina: ese fondo ES el color de la barra. Aca es NEGRO FIJO, sin depender del modo claro/oscuro de la app. */
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); width: 100%; height: calc(100% - env(safe-area-inset-top)); border: none; background: #000000; }
</style>
</head>
<body>
<script>
/* PRUEBA de barra superior NEGRA FIJA (iPad/celular), con el Inicio nuevo (/dev). NO reemplaza al index.html del lanzador.
   Uso: https://matezeher-cell.github.io/assix-launcher/barra-test.html
     (sin nada)      muestra la app de /dev (el Inicio nuevo)
     ?app=prod       muestra la app de produccion
     ?estilo=default|black|black-translucent   cambia el estilo de la barra (por defecto black-translucent); puede hacer falta borrar el icono y volver a agregarlo
   Ya no escucha el aviso de modo de la app: la barra es siempre negra (#000000), en modo claro y en oscuro. */
(function () {
  var q = new URLSearchParams(location.search);
  var estilo = q.get('estilo');
  if (estilo === 'default' || estilo === 'black' || estilo === 'black-translucent') {
    var mm = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]'); if (mm) mm.setAttribute('content', estilo);
  }
  document.documentElement.style.background = '#000000';
  document.body.style.background = '#000000';
  var f = document.createElement('iframe');
  f.src = q.get('app') === 'prod'
    ? 'https://script.google.com/macros/s/AKfycbw0PwVt9yT96PGSasYHaOzBGlXri0Mk1q5KI4UTmxaS7wu_KjpOGCBuF9ipqreJFm-i/exec'
    : 'https://script.google.com/macros/s/AKfycbxH8Q0IjRbNI7XDkRa3jHi6owFjsJ5JJ-l32wNsr8A/dev';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
